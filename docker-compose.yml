services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: group_diet
      POSTGRES_PASSWORD: group_diet_dev
      POSTGRES_DB: group_diet_support_ai
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
